spring:
  application:
    name: car-share-hub

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/carshare?options=-c%20timezone=UTC
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 8080

jwt:
  secret: my-secret-key-for-jwt-token-generation-must-be-at-least-256-bits-long
  expiration: 86400000

telegram:
  bot:
    enabled: ${TELEGRAM_BOT_ENABLED:false}
    username: ${TELEGRAM_BOT_USERNAME:carsharehub_bot}
    token: ${TELEGRAM_BOT_TOKEN:your-bot-token-here}

notification:
  scheduler:
    overdue-cron: "0 0 9 * * *"
    daily-cron: "0 0 8 * * *"
    payment-cron: "0 0 10 * * *"
